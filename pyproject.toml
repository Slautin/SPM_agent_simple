[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain-openai",
    "langchain-mcp-adapters",
    "python-dotenv",
    "scifireaders[mcp]",
]

[tool.setuptools.packages.find]
where = ["src"]